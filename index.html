<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  ШАБЛОН ЛЕНДІНГУ ДЛЯ БАРБЕРШОПІВ І БʼЮТІ/ХЕЙР-СТУДІЙ                         ║
║  Один файл: HTML + CSS + JS. Без фреймворків і збірки.                       ║
╚══════════════════════════════════════════════════════════════════════════════╝

ЯК АДАПТУВАТИ ПІД НОВОГО КЛІЄНТА ЗА 10 ХВИЛИН
─────────────────────────────────────────────
1. ПАПКА. Скопіюйте index.html у нову папку клієнта. Поруч створіть папку img/
   і покладіть туди фото у форматі .webp (конвертація: squoosh.app, якість 70–80).
   Розміри: hero ~1920px, «Про нас» ~1200px, майстри/галерея ~800px.

2. CONFIG. Усе редагується в одному об'єкті CONFIG (на початку <script> нижче):
   • type: "barber" (темна брутальна тема) або "studio" (світлий мінімалізм);
   • theme.accent — фірмовий колір одним рядком, напр. "#c0392b" (червоний).
     Колір тексту на кнопках підбирається автоматично під контраст;
   • name, slogan, usp, logo (картинка "img/logo.svg" або текстовий логотип);
   • contacts — телефон, Instagram, Telegram, Viber, адреса, координати;
     координати: Google Maps → правий клік по точці → перше число lat, друге lng;
   • schedule — графік по днях: "10:00-20:00" або null (вихідний);
   • services, team, gallery, reviews, vacancy — контент;
   • sections — перемикачі showAbout / showServices / showTeam / showGallery /
     showReviews / showVacancy / showBooking / showContacts. Вимкнена секція
     зникає повністю разом із пунктом меню.

3. ЗАЯВКИ (CONFIG.booking). Можна одне або обидва:
   • FormSubmit: впишіть email клієнта у formsubmitEmail. ПЕРША заявка надішле
     на цю пошту лист активації — клієнт має натиснути «Activate». Потім можна
     замінити email на випадковий ідентифікатор із того листа (щоб сховати пошту).
   • Telegram: бот через @BotFather → botToken; chatId — напишіть боту, потім
     відкрийте https://api.telegram.org/bot<TOKEN>/getUpdates і візьміть chat.id
     (для групи — додайте бота в групу, id буде від'ємний).
     ⚠ Токен видно в коді сторінки — робіть окремого бота ТІЛЬКИ для заявок.
   • Якщо нічого не вказано — форма працює в демо-режимі (нічого не надсилає).

4. SEO. JSON-LD, favicon і мета-теги заповнюються з CONFIG автоматично, АЛЕ
   Telegram/Viber/Facebook не виконують JS при побудові прев'ю посилання —
   тому вручну поправте теги з позначкою ✎ у <head> (title, description, og:*).
   Для og:image покладіть img/og.jpg 1200×630 (jpg/png — webp прев'ю підтримують не всі).

5. ПЕРЕВІРКА. Відкрийте сайт на телефоні, надішліть тестову заявку, перевірте
   «Відчинено/Зачинено» (рахується за часовим поясом CONFIG.timezone).
   Показати клієнту іншу тему без правок: додайте до адреси ?theme=studio
   або ?theme=barber.

Нічні графіки (напр. 18:00–02:00) не підтримуються — закриття має бути до 24:00.
-->

/* ═══════════════════ ТЕМИ (CSS-змінні) ═══════════════════ */
:root{
  --gutter:clamp(16px,4.5vw,40px);
  --maxw:1200px;
  --header-h:68px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ok:#3fb950; --bad:#e5484d;
}
[data-theme="barber"]{
  color-scheme:dark;
  --bg:#0e0e0f; --bg-2:#141416; --surface:#19191c; --surface-2:#232327;
  --line:rgba(255,255,255,.11); --text:#f3efe8; --muted:#a59f95;
  --accent:#c9a14a; --accent-ink:#111;
  --radius:4px; --radius-lg:6px; --btn-radius:2px;
  --font-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display-case:uppercase; --display-weight:600; --display-tracking:.025em; --display-lh:1.12;
  --h1-size:clamp(4.2rem,21vw,12rem); --h2-size:clamp(2.4rem,8vw,4.6rem);
  --btn-case:uppercase; --btn-tracking:.08em;
  --shadow:none;
}
[data-theme="studio"]{
  color-scheme:light;
  --bg:#f7f2ea; --bg-2:#efe7db; --surface:#fffcf7; --surface-2:#e9dfd0;
  --line:rgba(26,23,20,.12); --text:#1a1714; --muted:#6a6158;
  --accent:#c4472a; --accent-ink:#fff;
  --radius:18px; --radius-lg:28px; --btn-radius:999px;
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display-case:none; --display-weight:500; --display-tracking:-.005em; --display-lh:1.12;
  --h1-size:clamp(3.4rem,13vw,7.6rem); --h2-size:clamp(2.5rem,7vw,4.4rem);
  --btn-case:none; --btn-tracking:.01em;
  --shadow:0 24px 60px -34px rgba(70,45,20,.45);
}
:root{ --accent-soft:rgba(201,161,74,.14); }
@supports (color:color-mix(in srgb,red,blue)){
  :root,[data-theme]{ --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent); }
}

/* ═══════════════════ БАЗА ═══════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body.lock{overflow:hidden}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--font-display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--display-tracking);line-height:var(--display-lh);margin:0}
p{margin:0 0 1em}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--accent);color:var(--accent-ink);padding:10px 16px;font-weight:700;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}
.container{width:100%;max-width:calc(var(--maxw) + var(--gutter)*2);margin-inline:auto;padding-inline:var(--gutter)}
.icon{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-fill{fill:currentColor;stroke:none}

/* Зображення: фон-заглушка, якщо фото не завантажилось */
.ph{background:var(--surface-2);background-image:repeating-linear-gradient(135deg,transparent 0 14px,var(--line) 14px 15px);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;transition:opacity .5s;color:transparent}
.ph img.img-failed{opacity:0}

/* ═══════════════════ КНОПКИ ═══════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:50px;padding:0 26px;border:1px solid transparent;border-radius:var(--btn-radius);font-weight:700;font-size:.95rem;text-transform:var(--btn-case);letter-spacing:var(--btn-tracking);text-decoration:none;transition:transform .2s var(--ease),background-color .2s,color .2s,border-color .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:currentColor;background:transparent}
.btn-ghost:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-sm{min-height:42px;padding:0 18px;font-size:.85rem}
.btn-block{width:100%}
.link-arrow{display:inline-flex;align-items:center;gap:.4em;font-weight:700;color:var(--accent);text-decoration:none}
.link-arrow:hover{text-decoration:underline}

/* ═══════════════════ ШАПКА ═══════════════════ */
.header{position:fixed;inset:0 0 auto;z-index:50;height:var(--header-h);transition:background-color .3s,box-shadow .3s,border-color .3s;border-bottom:1px solid transparent}
.header.scrolled{background:color-mix(in srgb,var(--bg) 88%,transparent);background:var(--bg);border-color:var(--line)}
@supports (backdrop-filter:blur(10px)){.header.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3)}}
.header.menu-open{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--bg)!important}
.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;position:relative;z-index:2}
.logo img{width:auto}
.logo-text{font-family:var(--font-display);font-size:1.6rem;font-weight:700;text-transform:var(--display-case);letter-spacing:.04em;line-height:1}
[data-theme="studio"] .logo-text{font-style:italic;font-weight:600;letter-spacing:0;font-size:1.75rem}
.logo-sub{display:block;font-family:var(--font-body);font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:4px;font-style:normal}
.nav ul{display:flex;gap:28px}
.nav a{text-decoration:none;font-weight:600;font-size:.92rem;position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--accent);transition:right .3s var(--ease)}
.nav a:hover::after,.nav a.active::after{right:0}
.nav-extra{display:none}
.header-actions{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.header-cta{display:none}
.burger{width:46px;height:46px;display:grid;place-content:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:var(--btn-radius)}
.burger span{display:block;width:22px;height:2px;background:currentColor;transition:transform .3s var(--ease),opacity .2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@media (max-width:1023.98px){
  .nav{position:fixed;inset:0;background:var(--bg);padding:calc(var(--header-h) + 24px) var(--gutter) 32px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;visibility:hidden;opacity:0;transform:translateY(-12px);transition:opacity .3s,transform .3s var(--ease),visibility 0s .3s}
  .nav.open{visibility:visible;opacity:1;transform:none;transition:opacity .3s,transform .3s var(--ease)}
  .nav ul{flex-direction:column;gap:4px}
  .nav ul a{display:block;font-family:var(--font-display);font-size:clamp(2rem,9vw,2.8rem);text-transform:var(--display-case);line-height:1.2;padding:4px 0}
  .nav ul a::after{display:none}
  .nav-extra{display:grid;gap:16px;margin-top:32px}
  .nav-extra .phone{font-size:1.25rem;font-weight:700;text-decoration:none}
}
@media (min-width:480px){.header-cta{display:inline-flex}}
@media (min-width:1024px){.burger{display:none}}

.socials{display:flex;gap:10px;flex-wrap:wrap}
.socials a{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--btn-radius);text-decoration:none;transition:background-color .2s,color .2s,border-color .2s}
.socials a:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.socials .icon{width:20px;height:20px}

/* Статус «відчинено» */
.status{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.status.is-open .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}

/* ═══════════════════ HERO ═══════════════════ */
.hero{position:relative;display:grid;padding-inline:max(var(--gutter),calc((100% - var(--maxw))/2))}
.hero-content>*{animation:rise .9s var(--ease) both}
.hero-content>*:nth-child(2){animation-delay:.08s}.hero-content>*:nth-child(3){animation-delay:.16s}
.hero-content>*:nth-child(4){animation-delay:.24s}.hero-content>*:nth-child(5){animation-delay:.32s}
.hero-content>*:nth-child(6){animation-delay:.4s}.hero-content>*:nth-child(7){animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero .eyebrow{margin-bottom:18px}
.hero-content{min-width:0}
.hero h1{font-size:min(var(--h1-size),calc(110vw / var(--len,4)));margin-bottom:.12em;line-height:1.05;padding-top:.08em;overflow-wrap:anywhere}
@media (min-width:1024px){.hero h1{font-size:min(var(--h1-size),calc(90vw / var(--len,4)))}}
.hero .slogan{font-family:var(--font-display);font-size:clamp(1.3rem,4.4vw,2.1rem);line-height:1.15;margin-bottom:16px;text-transform:var(--display-case)}
.hero .usp{max-width:560px;color:var(--muted);font-size:1.05rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 28px}
.hero-actions .btn{flex:1 1 180px}
@media (min-width:560px){.hero-actions .btn{flex:0 0 auto}}
.usp-points{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:.9rem;font-weight:600}
.usp-points li{display:flex;align-items:center;gap:8px}
.usp-points .icon{color:var(--accent)}
.hero-media img,.hero-media video{width:100%;height:100%;object-fit:cover}

/* barber: повноекранне фото з затемненням */
[data-theme="barber"] .hero{min-height:100vh;min-height:100svh;align-items:end;padding-top:calc(var(--header-h) + 40px);padding-bottom:clamp(40px,8vh,90px)}
[data-theme="barber"] .hero-media{position:absolute;inset:0;z-index:-2}
[data-theme="barber"] .hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(14,14,15,1) 0%,rgba(14,14,15,.82) 35%,rgba(14,14,15,.45) 75%,rgba(14,14,15,.6) 100%)}
[data-theme="barber"] .hero h1{color:var(--text)}
[data-theme="barber"] .hero .slogan{color:var(--accent)}
[data-theme="barber"] .hero .usp{color:#cfc9bf}
[data-theme="barber"] .hero-media img{filter:grayscale(.35) contrast(1.05)}

/* studio: розділений екран, фото з великими радіусами */
[data-theme="studio"] .hero{gap:32px;padding-top:calc(var(--header-h) + 28px);padding-bottom:56px}
[data-theme="studio"] .hero-media{order:2;aspect-ratio:4/5;max-height:72vh;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
[data-theme="studio"] .hero h1{font-style:italic}
[data-theme="studio"] .hero .slogan{font-style:normal}
@media (min-width:1024px){
  [data-theme="studio"] .hero{grid-template-columns:1.15fr .85fr;align-items:center;min-height:100vh;min-height:100svh;gap:64px}
  [data-theme="studio"] .hero-media{max-height:none;height:min(78vh,760px);aspect-ratio:auto;border-radius:220px 220px var(--radius-lg) var(--radius-lg)}
}

/* ═══════════════════ СЕКЦІЇ ═══════════════════ */
section[id]{scroll-margin-top:calc(var(--header-h) - 1px)}
.section{padding-block:clamp(72px,11vw,136px)}
.section--alt{background:var(--bg-2)}
.sec-head{max-width:760px;margin-bottom:clamp(36px,6vw,64px)}
.sec-head h2{font-size:var(--h2-size)}
.sec-head p{color:var(--muted);margin:18px 0 0;font-size:1.05rem}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px;line-height:1.4;font-size:.76rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
[data-theme="studio"] h2 em{color:var(--accent)}

/* Поява блоків */
.js-reveal .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js-reveal .reveal.in{opacity:1;transform:none}

/* ── Про нас ── */
.about{display:grid;gap:40px;align-items:center}
.about-media{aspect-ratio:4/5;border-radius:var(--radius-lg)}
.about-text p{color:var(--muted);font-size:1.05rem}
.about-text p:first-of-type{color:var(--text);font-size:1.2rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
.stats b{display:block;font-family:var(--font-display);font-size:clamp(2.2rem,7vw,3.2rem);line-height:1;color:var(--accent);font-weight:var(--display-weight)}
.stats span{font-size:.85rem;color:var(--muted)}
@media (min-width:900px){.about{grid-template-columns:.9fr 1.1fr;gap:72px}.about-text .sec-head{margin-bottom:28px}}

.about--noimg{align-items:start}
@media (min-width:900px){.about--noimg{grid-template-columns:1fr 1fr}.about--noimg .sec-head{margin:0}}
.about--noimg .about-text>.reveal:first-child p:first-of-type{margin-top:0}
/* hero без фото: логотип-емблема */
.hero-media--emblem{background:radial-gradient(ellipse 60% 70% at 78% 45%,var(--accent-soft),transparent 70%)}
.hero-emblem{position:absolute;right:max(var(--gutter),calc((100% - var(--maxw))/2));top:50%;transform:translateY(-50%);width:min(64vw,500px);opacity:.1;animation:emblem 1.4s var(--ease) both}
.hero-emblem img{width:100%;height:auto}
@media (min-width:1024px){.hero:has(.hero-media--emblem) h1{font-size:min(var(--h1-size),calc(60vw / var(--len,4)))}.hero:has(.hero-media--emblem) .hero-content{max-width:60%}.hero-emblem{opacity:1;width:min(30vw,400px);filter:drop-shadow(0 10px 40px rgba(0,0,0,.6))}[data-theme="barber"] .hero:has(.hero-media--emblem)::before{background:linear-gradient(to right,rgba(14,14,15,.9),rgba(14,14,15,0) 65%)}}
@media (max-width:1023.98px){.hero-emblem{top:34%}}
@keyframes emblem{from{opacity:0;transform:translateY(-46%) scale(.96)}}
[data-theme="studio"] .hero-media--emblem{display:grid;place-items:center;background:var(--surface-2)}
[data-theme="studio"] .hero-emblem{position:static;transform:none;opacity:1;width:60%;filter:invert(1)}

/* ── Послуги ── */

  // ═════════ SEO ═════════
  function applySEO() {
    const seo = C.seo || {};
    if (seo.title) document.title = seo.title;
    const setMeta = (sel, attr, val) => { if (!val) return; let m = document.head.querySelector(sel); if (!m) { m = document.createElement("meta"); const [k, v] = sel.match(/\[(.+?)="(.+?)"\]/).slice(1); m.setAttribute(k, v); document.head.appendChild(m); } m.setAttribute(attr, val); };
    setMeta('meta[name="description"]', "content", seo.description);
    setMeta('meta[property="og:title"]', "content", seo.title);
    setMeta('meta[property="og:description"]', "content", seo.description);
    setMeta('meta[property="og:image"]', "content", seo.ogImage);
    setMeta('meta[property="og:url"]', "content", seo.url);
    setMeta('meta[name="theme-color"]', "content", getComputedStyle(root).getPropertyValue("--bg").trim());
    if (seo.url) { const l = document.createElement("link"); l.rel = "canonical"; l.href = seo.url; document.head.appendChild(l); }

    // favicon
    const fav = document.getElementById("favicon");
    if (seo.favicon) fav.href = seo.favicon;
    else {
      const accent = getComputedStyle(root).getPropertyValue("--accent").trim() || "#c9a14a";
      const ink = getComputedStyle(root).getPropertyValue("--accent-ink").trim() || "#111";
      const letter = ((C.logo && C.logo.text) || C.name || "?").trim()[0];
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="${C.type === "studio" ? 32 : 10}" fill="${accent}"/><text x="32" y="45" font-family="Arial,sans-serif" font-weight="700" font-size="38" text-anchor="middle" fill="${ink}">${esc(letter)}</text></svg>`;
      fav.href = "data:image/svg+xml," + encodeURIComponent(svg);
      fav.type = "image/svg+xml";
    }

    // JSON-LD
    const ld = {
      "@context": "https://schema.org",
      "@type": C.type === "barber" ? "BarberShop" : "HairSalon",
      name: C.businessType + " «" + C.name + "»",
      description: seo.description || C.usp,
      url: seo.url,
      telephone: ct.phone,
      email: ct.email || undefined,
      image: [C.hero && C.hero.image, C.about && C.about.image].filter(Boolean),
      logo: C.logo && C.logo.image ? C.logo.image : undefined,
      priceRange: seo.priceRange || undefined,
      address: { "@type": "PostalAddress", streetAddress: ct.address, addressLocality: ct.city, addressRegion: ct.region, postalCode: ct.postalCode, addressCountry: "UA" },
      geo: ct.lat ? { "@type": "GeoCoordinates", latitude: ct.lat, longitude: ct.lng } : undefined,
      openingHoursSpecification: DAY_KEYS.map((k, i) => { const h = hoursFor(i); return h ? { "@type": "OpeningHoursSpecification", dayOfWeek: "https://schema.org/" + DAY_SCHEMA[i], opens: fromMin(h[0]), closes: fromMin(h[1]) } : null; }).filter(Boolean),
      sameAs: [links.instagram, links.telegram, links.facebook, links.tiktok].filter(Boolean),
      hasOfferCatalog: on("services") ? {
        "@type": "OfferCatalog", name: "Послуги",
        itemListElement: (C.services || []).map(c => ({ "@type": "OfferCatalog", name: c.category,
          itemListElement: (c.items || []).map(s => ({ "@type": "Offer", itemOffered: { "@type": "Service", name: s.name, description: s.desc },
            ...(typeof minPrice(s.price) === "number" && isFinite(minPrice(s.price)) ? { price: minPrice(s.price), priceCurrency: "UAH" } : {}) })) }))
      } : undefined
    };
    const s = document.createElement("script");
    s.type = "application/ld+json";
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  }

  // ═════════ ПОВЕДІНКА ═════════
  function initImages() {
    document.querySelectorAll(".ph img").forEach(im => {
      const fail = () => im.classList.add("img-failed");
      if (im.complete && im.naturalWidth === 0 && im.src) fail();
      im.addEventListener("error", fail, { once: true });
    });
  }

  function initHeader() {
    const header = document.getElementById("header");
    const onScroll = () => header.classList.toggle("scrolled", scrollY > 12);
    addEventListener("scroll", onScroll, { passive: true }); onScroll();

    const burger = header.querySelector(".burger"), nav = document.getElementById("site-nav");
    const setOpen = open => {
      burger.setAttribute("aria-expanded", open);
      burger.setAttribute("aria-label", open ? "Закрити меню" : "Відкрити меню");
      nav.classList.toggle("open", open);
      document.body.classList.toggle("lock", open);
      header.classList.toggle("menu-open", open);
      if (open) header.classList.add("scrolled"); else onScroll();
    };
    burger.addEventListener("click", () => setOpen(burger.getAttribute("aria-expanded") !== "true"));
    nav.addEventListener("click", e => { if (e.target.closest("a")) setOpen(false); });
    addEventListener("keydown", e => { if (e.key === "Escape" && nav.classList.contains("open")) { setOpen(false); burger.focus(); } });
    matchMedia("(min-width:1024px)").addEventListener("change", e => { if (e.matches) setOpen(false); });

    // підсвічування активного пункту меню
    if ("IntersectionObserver" in window) {
      const navLinks = [...nav.querySelectorAll("ul a")];
      const io = new IntersectionObserver(entries => entries.forEach(en => {
        if (en.isIntersecting) navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      }), { rootMargin: "-45% 0px -50% 0px" });
      NAV.forEach(k => { const el = document.getElementById(k); if (el) io.observe(el); });
    }
  }

  function initReveal() {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !("IntersectionObserver" in window)) return;
    root.classList.add("js-reveal");
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
    }), { rootMargin: "0px 0px -8% 0px", threshold: .08 });
    document.querySelectorAll(".reveal").forEach((el, i) => {
      el.style.transitionDelay = (el.matches(".g-item,.master") ? (i % 4) * 70 : 0) + "ms";
      io.observe(el);
    });
  }

  function initStatus() {
    const update = () => {
      const st = getStatus();
      document.querySelectorAll("[data-status]").forEach(el => {
        el.classList.toggle("is-open", st.open);
        el.querySelector(".status-text").textContent = st.text;
      });
    };
    update(); setInterval(update, 60000);
  }

  // Рівень майстра: явне поле level у CONFIG.team або збіг ролі з назвою рівня
  const levelOf = m => typeof m.level === "number" ? m.level
    : LEVELS.findIndex(l => l.toLowerCase() === String(m.role || "").toLowerCase());
  function applyLevel(i) {
    document.querySelectorAll("#services .level").forEach(x => x.setAttribute("aria-pressed", +x.dataset.level === i));
    document.querySelectorAll("#services .svc-price[data-prices]").forEach(el => {
      const v = JSON.parse(el.dataset.prices)[i];
      el.textContent = fmtPrice(v);
      el.closest(".svc").classList.toggle("svc--na", v == null);
    });
  }
  function initLevels() {
    document.querySelectorAll("#services .level").forEach(b => b.addEventListener("click", () => applyLevel(+b.dataset.level)));
  }

  function initTabs() {
    const tabs = [...document.querySelectorAll('#services [role="tab"]')];
    if (!tabs.length) return;
    const select = (tab, focus) => {
      tabs.forEach(t => {
        const sel = t === tab;
        t.setAttribute("aria-selected", sel); t.tabIndex = sel ? 0 : -1;
        document.getElementById(t.getAttribute("aria-controls")).hidden = !sel;
      });
      if (focus) tab.focus();
      tab.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    };
    tabs.forEach((t, i) => {
      t.addEventListener("click", () => select(t));
      t.addEventListener("keydown", e => {
        const map = { ArrowRight: 1, ArrowLeft: -1, Home: "first", End: "last" };
        if (!(e.key in map)) return;
        e.preventDefault();
        const n = map[e.key] === "first" ? 0 : map[e.key] === "last" ? tabs.length - 1 : (i + map[e.key] + tabs.length) % tabs.length;
        select(tabs[n], true);
      });
    });
  }

  function initLightbox() {
    const dlg = document.getElementById("lightbox");
    if (!dlg) return;
    const im = dlg.querySelector("img"), count = dlg.querySelector(".lb-count");
    const G = C.gallery; let cur = 0, opener = null;
    const show = i => { cur = (i + G.length) % G.length; im.src = G[cur].src.replace(/w=\d+/, "w=1600"); im.alt = G[cur].alt || ""; count.textContent = (cur + 1) + " / " + G.length; };
    document.querySelectorAll("[data-lb]").forEach(b => b.addEventListener("click", () => {
      opener = b; show(+b.dataset.lb);
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
      document.body.classList.add("lock");
    }));
    dlg.addEventListener("close", () => { document.body.classList.remove("lock"); opener && opener.focus(); });
    dlg.querySelector(".lb-close").addEventListener("click", () => dlg.close());
    dlg.querySelector(".lb-prev").addEventListener("click", () => show(cur - 1));
    dlg.querySelector(".lb-next").addEventListener("click", () => show(cur + 1));
    dlg.querySelector(".lb-stage").addEventListener("click", e => { if (e.target === e.currentTarget) dlg.close(); });
    dlg.addEventListener("keydown", e => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
    let x0 = null, y0 = null;
    dlg.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    dlg.addEventListener("touchend", e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) dlg.close();
      x0 = null;
    }, { passive: true });
  }

  function initSlider() {
    const track = document.querySelector(".slider-track");
    if (!track) return;
    const [prev, next] = document.querySelectorAll(".slider-nav button");
    const step = () => { const s = track.children[0]; return s ? s.getBoundingClientRect().width + 16 : track.clientWidth; };
    const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
    const upd = () => { prev.disabled = track.scrollLeft <= 4; next.disabled = atEnd(); };
    prev.addEventListener("click", () => track.scrollBy({ left: -step() }));
    next.addEventListener("click", () => track.scrollBy({ left: step() }));
    track.addEventListener("scroll", () => requestAnimationFrame(upd), { passive: true });
    addEventListener("resize", upd); upd();
    track.addEventListener("keydown", e => { if (e.key === "ArrowRight") { e.preventDefault(); next.click(); } if (e.key === "ArrowLeft") { e.preventDefault(); prev.click(); } });

    // автопрокрутка: пауза при наведенні/фокусі/дотику, вимкнена при prefers-reduced-motion
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let paused = false, visible = false;
    const slider = track.closest(".slider");
    ["mouseenter", "focusin", "touchstart"].forEach(ev => slider.addEventListener(ev, () => paused = true, { passive: true }));
    ["mouseleave", "focusout"].forEach(ev => slider.addEventListener(ev, () => paused = false));
    new IntersectionObserver(([en]) => visible = en.isIntersecting).observe(slider);
    setInterval(() => {
      if (paused || !visible || document.hidden) return;
      if (atEnd()) track.scrollTo({ left: 0 }); else track.scrollBy({ left: step() });
    }, 6000);
  }

  function initFab() {
    const fab = document.getElementById("fab");
    if (!fab) return;
    const btn = fab.querySelector(".fab-main");
    const set = o => { fab.classList.toggle("open", o); btn.setAttribute("aria-expanded", o); };
    btn.addEventListener("click", () => set(!fab.classList.contains("open")));
    document.addEventListener("click", e => { if (!fab.contains(e.target)) set(false); });
    addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
    // ховаємо над формою запису, щоб не перекривала кнопку «Надіслати»
    const form = document.getElementById("booking-box") || document.querySelector(".ext-book");
    if (form && "IntersectionObserver" in window) new IntersectionObserver(([en]) => fab.classList.toggle("hide", en.isIntersecting), { threshold: .15 }).observe(form);
  }

  // ── Документи (оферта тощо): CONFIG.legalDocs → посилання в контактах і футері + вікно з текстом ──
  function docBody(t) {
    const link = l => l.replace(/https?:\/\/[^\s<]+?(?=[.,;)]?(\s|$))/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    return String(t || "").split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
      const e = esc(l);
      return /^\d+\.\s+[^a-zа-яіїєґ]+$/.test(l) ? `<h3>${e}</h3>` : `<p>${link(e)}</p>`;
    }).join("");
  }
  function renderDocs() {
    return DOCS.map((d, i) => `<dialog class="modal" id="doc-${i}" aria-labelledby="doc-title-${i}">
      <button class="modal-close" type="button" aria-label="Закрити" data-close>${icon("close")}</button>
      <div class="modal-body doc-body"><h2 id="doc-title-${i}">${esc(d.title)}</h2>${docBody(d.text)}</div>
    </dialog>`).join("");
  }
  function initDocs() {
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-doc]");
      if (!t) return;
      const dlg = document.getElementById("doc-" + t.dataset.doc);
      if (dlg) { dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""); dlg.querySelector(".modal-body").scrollTop = 0; }
    });
    document.querySelectorAll('dialog[id^="doc-"]').forEach(dlg => {
      dlg.querySelector("[data-close]").addEventListener("click", () => dlg.close());
      dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
    });
  }

  function initPrivacy() {
    const dlg = document.getElementById("privacy");
    if (!dlg) return;
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-privacy]");
      if (t) { e.preventDefault(); dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""); }
    });
    dlg.querySelector("[data-close]").addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  }

  // ═════════ ФОРМА ЗАПИСУ ═════════
  function initBooking() {
    const form = document.getElementById("booking-form");
    if (!form) return;
    const B = C.booking || {};
    const $ = id => document.getElementById(id);
    const fName = $("f-name"), fPhone = $("f-phone"), fService = $("f-service"), fMaster = $("f-master"),
      fDate = $("f-date"), fTime = $("f-time"), fConsent = $("f-consent"), errBox = $("form-error"), hint = $("price-hint");
    const svcByValue = {}, teamLevel = {};
    (C.services || []).forEach(c => (c.items || []).forEach(sv => svcByValue[c.category + " — " + sv.name] = sv));
    (C.team || []).forEach(m => teamLevel[m.name] = levelOf(m));

    // Підстановка послуги / майстра з кнопок на сторінці
    document.addEventListener("click", e => {
      const s = e.target.closest("[data-book-service]"), m = e.target.closest("[data-book-master]");
      if (s) {
        fService.value = s.dataset.bookService; setErr(fService, "");
        // якщо обраний майстер не виконує цю послугу — скидаємо на «будь-який»
        const sv = svcByValue[fService.value], l = fMaster ? teamLevel[fMaster.value] : -1;
        if (sv && Array.isArray(sv.price) && l >= 0 && sv.price[l] == null) fMaster.value = fMaster.options[0].value;
      }
      if (m && fMaster) fMaster.value = m.dataset.bookMaster;
      if (s || m) syncPrices();
      if (s || m) setTimeout(() => fName.focus({ preventScroll: true }), 600);
    });

    // Маска телефону +380 (XX) XXX-XX-XX
    const digitsOf = v => { let d = v.replace(/\D/g, ""); while (d.startsWith("380")) d = d.slice(3); if (d.startsWith("80")) d = d.slice(2); return d.replace(/^0+/, "").slice(0, 9); };
    const fmtPhone = d => {
      let out = "+380";
      if (d.length) out += " (" + d.slice(0, 2);
      if (d.length >= 2) out += ")";
      if (d.length > 2) out += " " + d.slice(2, 5);
      if (d.length > 5) out += "-" + d.slice(5, 7);
      if (d.length > 7) out += "-" + d.slice(7, 9);
      return out;
    };
    let prevDigits = "";
    fPhone.addEventListener("focus", () => { if (!fPhone.value) fPhone.value = "+380 "; });
    fPhone.addEventListener("blur", () => { if (!digitsOf(fPhone.value)) fPhone.value = ""; });
    fPhone.addEventListener("input", e => {
      let d = digitsOf(fPhone.value);
      if (e.inputType === "deleteContentBackward" && d === prevDigits) d = d.slice(0, -1);
      prevDigits = d;
      fPhone.value = d ? fmtPhone(d) : "+380 ";
      if (d.length === 9) setErr(fPhone, "");
    });

    // Дати й час за графіком
    const now = zonedNow();
    fDate.min = now.iso;
    const max = new Date(now.iso + "T12:00:00"); max.setDate(max.getDate() + (B.daysAhead || 45));
    fDate.max = max.toISOString().slice(0, 10);
    const dayIdxOf = iso => (new Date(iso + "T12:00:00").getDay() + 6) % 7;
    const fillTimes = () => {
      fTime.innerHTML = "";
      const v = fDate.value;
      if (!v) { fTime.disabled = true; fTime.add(new Option("Спершу оберіть дату", "")); return; }
      const h = hoursFor(dayIdxOf(v));
      if (!h) { fTime.disabled = true; fTime.add(new Option("У цей день вихідний", "")); setErr(fDate, "У цей день ми не працюємо — оберіть іншу дату"); return; }
      const step = B.slotStep || 30, n = zonedNow();
      const slots = [];
      for (let m = h[0]; m <= h[1] - step; m += step) if (v !== n.iso || m > n.minutes + 30) slots.push(fromMin(m));
      if (!slots.length) { fTime.disabled = true; fTime.add(new Option("На сьогодні вільного часу немає", "")); setErr(fDate, "На сьогодні запис уже закрито — оберіть іншу дату"); return; }
      setErr(fDate, "");
      fTime.disabled = false;
      fTime.add(new Option("Оберіть час", ""));
      slots.forEach(s => fTime.add(new Option(s, s)));
    };
    fDate.addEventListener("change", fillTimes);
    fTime.addEventListener("change", () => fTime.value && setErr(fTime, ""));
    fService.addEventListener("change", () => { fService.value && setErr(fService, ""); syncPrices(); });
    if (fMaster) fMaster.addEventListener("change", () => syncPrices(true));

    // ── Ціни залежно від рівня майстра ──
    function priceText() {
      const sv = svcByValue[fService.value];
      if (!sv) return "";
      const l = fMaster ? teamLevel[fMaster.value] : -1;
      if (!Array.isArray(sv.price)) return "Вартість: " + fmtPrice(sv.price);
      if (l >= 0) return `Вартість у майстра ${fMaster.value} (${LEVELS[l]}): ` + fmtPrice(sv.price[l]);
      const vals = sv.price.filter(v => typeof v === "number");
      const lo = Math.min(...vals), hi = Math.max(...vals);
      return lo === hi ? "Вартість: " + fmtPrice(lo) : `Вартість: від ${fmtPrice(lo)} до ${fmtPrice(hi)} — залежить від рівня майстра`;
    }
    function syncPrices(fromMaster) {
      if (!LEVELS.length) return;
      const l = fMaster ? teamLevel[fMaster.value] : -1;
      [...fService.options].forEach(o => {
        const sv = svcByValue[o.value];
        if (!sv) return;
        const na = l >= 0 && Array.isArray(sv.price) && sv.price[l] == null;
        o.disabled = na;
        o.textContent = sv.name + " · " + (!Array.isArray(sv.price) ? fmtPrice(sv.price)
          : l >= 0 ? (na ? "не виконує" : fmtPrice(sv.price[l])) : "від " + fmtPrice(minPrice(sv.price)));
      });
      const cur = svcByValue[fService.value];
      if (fMaster) [...fMaster.options].forEach(o => {
        const ml = teamLevel[o.value];
        o.disabled = !!cur && Array.isArray(cur.price) && ml >= 0 && cur.price[ml] == null;
      });
      if (fService.selectedOptions[0] && fService.selectedOptions[0].disabled) {
        fService.value = "";
        setErr(fService, "Цей майстер не виконує обрану послугу — оберіть іншу");
      }
      if (hint) { const t = priceText(); hint.textContent = t; hint.hidden = !t; }
      if (fromMaster && l >= 0) applyLevel(l);
    }
    fName.addEventListener("input", () => fName.value.trim().length >= 2 && setErr(fName, ""));
    fConsent.addEventListener("change", () => fConsent.checked && setErr(fConsent, ""));

    function setErr(el, msg) {
      const box = document.getElementById(el.getAttribute("aria-describedby"));
      if (box) box.textContent = msg;
      el.setAttribute("aria-invalid", msg ? "true" : "false");
      return !msg;
    }
    function validate() {
      const checks = [
        [fName, fName.value.trim().length >= 2 ? "" : "Вкажіть імʼя (мінімум 2 літери)"],
        [fPhone, digitsOf(fPhone.value).length === 9 ? "" : "Вкажіть номер повністю: +380 (XX) XXX-XX-XX"],
        [fService, fService.value ? "" : "Оберіть послугу"],
        [fDate, !fDate.value ? "Оберіть дату" : fDate.value < fDate.min ? "Дата вже минула" : !hoursFor(dayIdxOf(fDate.value)) ? "У цей день ми не працюємо" : ""],
        [fTime, fTime.value ? "" : "Оберіть час"],
        [fConsent, fConsent.checked ? "" : "Потрібна ваша згода"]
      ];
      let first = null;
      checks.forEach(([el, msg]) => { if (!setErr(el, msg) && !first) first = el; });
      if (first) first.focus();
      return !first;
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errBox.hidden = true;
      if (form._honey.value) return;               // бот
      if (!validate()) return;
      const dateHuman = new Date(fDate.value + "T12:00:00").toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" });
      const data = {
        "Імʼя": fName.value.trim(),
        "Телефон": fPhone.value,
        "Послуга": fService.value,
        "Майстер": fMaster ? fMaster.value + (teamLevel[fMaster.value] >= 0 ? " (" + LEVELS[teamLevel[fMaster.value]] + ")" : "") : "—",
        ...(hint && hint.textContent ? { "Вартість": hint.textContent.replace(/^Вартість[^:]*:\s*/, "") } : {}),
        "Дата": dateHuman,
        "Час": fTime.value,
        ...($("f-comment") ? { "Коментар": $("f-comment").value.trim() || "—" } : {})
      };
      const btn = form.querySelector('[type="submit"]'), label = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Надсилаємо…';
      try {
        const res = await sendBooking(data);
        showSuccess(res === "demo");
      } catch (err) {
        errBox.innerHTML = "Не вдалося надіслати заявку. " + (ct.phone ? `Будь ласка, зателефонуйте нам: <a href="${telHref}">${esc(ct.phoneLabel || ct.phone)}</a>` : "Спробуйте ще раз.");
        errBox.hidden = false;
        btn.disabled = false; btn.innerHTML = label;
      }
    });

    async function sendBooking(data) {
      const tasks = [];
      const subject = "Нова заявка на запис — " + C.name;
      if (B.formsubmitEmail) {
        tasks.push(fetch("https://formsubmit.co/ajax/" + encodeURIComponent(B.formsubmitEmail), {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ ...data, _subject: subject, _template: "table", _captcha: "false" })
        }).then(r => r.json()).then(j => { if (String(j.success) !== "true") throw new Error(j.message || "FormSubmit"); }));
      }
      const tg = B.telegram || {};
      if (tg.botToken && tg.chatId) {
        const h = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
        const text = `<b>${h(subject)}</b>\n\n` + Object.entries(data).map(([k, v]) => `<b>${h(k)}:</b> ${h(v)}`).join("\n");
        tasks.push(fetch(`https://api.telegram.org/bot${tg.botToken}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: tg.chatId, text, parse_mode: "HTML" })
        }).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.description || "Telegram"); }));
      }
      if (!tasks.length) { await new Promise(r => setTimeout(r, 700)); console.info("[Запис] Демо-режим: вкажіть formsubmitEmail або telegram у CONFIG.booking", data); return "demo"; }
      const results = await Promise.allSettled(tasks);
      if (results.some(r => r.status === "fulfilled")) return "ok";
      throw results[0].reason;
    }

    function showSuccess(demo) {
      const box = $("booking-box");
      const formNode = form;
      const wrap = document.createElement("div");
      wrap.className = "form form-success";
      wrap.setAttribute("role", "status");
      wrap.tabIndex = -1;
      wrap.innerHTML = `<span class="ok-icon">${icon("check")}</span>
        <h3>${esc(B.successTitle || "Дякуємо!")}</h3>
        <p>${esc(B.successText || "")}${demo ? "<br><small>(демо-режим: заявку нікуди не надіслано)</small>" : ""}</p>
        <button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px">Новий запис</button>`;
      formNode.hidden = true;
      box.appendChild(wrap);
      wrap.focus();
      wrap.querySelector("button").addEventListener("click", () => {
        formNode.reset(); prevDigits = ""; fillTimes(); setErr(fDate, "");
        wrap.remove(); formNode.hidden = false;
        const b = formNode.querySelector('[type="submit"]'); b.disabled = false; b.textContent = "Надіслати заявку";
        fName.focus();
      });
    }
  }

  // ═════════ СТАРТ ═════════
  function boot() {
    document.getElementById("header").innerHTML = renderHeader();
    const parts = [renderHero()];
    if (on("about")) parts.push(renderAbout());
    if (on("services") && (C.services || []).length) parts.push(renderServices());
    if (on("team") && (C.team || []).length) parts.push(renderTeam());
    if (on("gallery") && (C.gallery || []).length) parts.push(renderGallery());
    if (on("reviews") && (C.reviews || []).length) parts.push(renderReviews());
    if (on("vacancy")) parts.push(renderVacancy());
    if (on("booking")) parts.push(renderBooking());
    if (on("contacts")) parts.push(renderContacts());
    document.getElementById("main").innerHTML = parts.join("");
    document.getElementById("footer").innerHTML = renderFooter();
    document.getElementById("overlays").innerHTML = renderFab() + renderPrivacy() + renderDocs();

    applySEO();
    [initImages, initHeader, initReveal, initStatus, initLevels, initTabs, initLightbox, initSlider, initFab, initPrivacy, initDocs, initBooking]
      .forEach(fn => { try { fn(); } catch (err) { console.error(fn.name, err); } });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>

<main id="main" tabindex="-1"></main>
<footer class="footer" id="footer"></footer>
<div id="overlays"></div>
